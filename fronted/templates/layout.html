{% load static %}

<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormulaBlog — F1 Dünyasının Ən Yaxşı Analiz Platforması</title>
  <meta name="description" content="Formula 1 dünyasını ətraflı araşdıran, texniki analiz, yarış reportajı və sürücü profilləri üzrə Azərbaycanın premier F1 blog platforması.">
  <meta property="og:title" content="FormulaBlog — F1 Analiz Platforması">
  <meta property="og:description" content="Formula 1 dünyasını ətraflı araşdıran premium blog.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="{% static 'assets/css/main.css' %}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
</head>
<body>

  <div id="header-root"></div>

  <main id="main-content">
    {% block main %}{% endblock main %}
  </main>

  <div id="footer-root"></div>

  <script type="module">
    import {
      renderHeader,
      renderFooter,
      initHeaderBehavior,
      highlightActiveNav
    } from "{% static 'assets/js/utils.js' %}";

    document.getElementById('header-root').innerHTML = renderHeader();
    document.getElementById('footer-root').innerHTML = renderFooter();
    initHeaderBehavior();
    highlightActiveNav();
  </script>
  {% block extra_scripts %}{% endblock extra_scripts %}
</body>
</html>
