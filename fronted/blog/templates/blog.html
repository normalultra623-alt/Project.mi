{% extends 'layout.html' %}

{% block main %}

<main id="main-content">

  <!-- Page Hero -->
  <section class="page-hero" aria-labelledby="blog-page-title">
    <div class="page-hero__inner">
      
      <p class="page-hero__eyebrow">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        {{article.categories}}
      </p>
      <h1 class="page-hero__title" id="blog-page-title">
        {{article.title}} <span>{{article.archive}}</span>
      </h1>
      <p class="page-hero__desc">{{article.description}}</p>
            
    </div>
    <div class="red-stripe" aria-hidden="true"></div>
  </section>

  <!-- Sticky Toolbar: Search + Tags + Author filter -->
  <div class="blog-toolbar" role="search" aria-label="Məqalə filtrləri">
    <div class="blog-toolbar__inner">
      
      <!-- Left: search + tags -->
      <div class="blog-toolbar__left">
        <div class="search-box">
          <span class="search-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input type="search" id="search-input" placeholder="Məqalə axtar..." aria-label="Məqalə adına görə axtar" autocomplete="off">
          <button class="search-clear" id="search-clear" aria-label="Axtarışı təmizlə">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- Right: author + sort -->
      <div class="blog-toolbar__right">
        <select id="author-filter" class="author-filter" aria-label="Müəllif üzrə filtrləyin">
          <option value="all">Bütün Müəlliflər</option>
        </select>
        <select id="sort-select" class="sort-select" aria-label="Sıralama">
          <option value="newest">Ən Yeni</option>
          <option value="oldest">Ən Köhnə</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Tags Filter Row -->
  <div style="background:var(--clr-card);border-bottom:1px solid var(--clr-border);padding:.75rem var(--container-pad)">
    <div style="max-width:var(--container-max);margin-inline:auto">
      <div class="tags-filter" id="tags-filter" role="group" aria-label="Teq üzrə filtrləyin">
        <!-- Injected by JS -->
      </div>
    </div>
  </div>
  
  {% for post in posts %}

  <section class="section" aria-labelledby="posts-count-label">
    <div class="container">
      <div class="blog-results-meta">
        <p class="blog-results-meta__count" id="results-count" aria-live="polite" aria-atomic="true">
          Yüklənir...
        </p>
      </div>

      <div id="posts-grid" class="blog-posts-grid" aria-label="Məqalə siyahısı">
        <!-- Skeleton -->
        <div class="skeleton skeleton--card"></div>
        <div class="skeleton skeleton--card"></div>
        <div class="skeleton skeleton--card"></div>
        <div class="skeleton skeleton--card"></div>
        <div class="skeleton skeleton--card"></div>
        <div class="skeleton skeleton--card"></div>
      </div>

      <!-- Empty state -->
      <div id="empty-state" class="empty-state" style="display:none" role="status">
        <div class="empty-state__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        </div>
        <h2 class="empty-state__title">{{post.title}}</h2>
        <p class="empty-state__desc">{{post.description}}</p>
        <button class="btn btn--primary" id="reset-filters-btn" style="margin-top:1rem">{{post.filter}}</button>
      </div>

      <!-- Pagination -->
      <nav id="pagination" class="pagination" aria-label="Səhifələmə" style="display:none"></nav>
    </div>
  </section>
  
  {% endfor %}



</main>

{% endblock main %}
